<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜在庫管理アプリ</title>
<style>
:root{color-scheme:light dark;--bg:#f4f4f3;--fg:#17271f;--muted:#6a756f;--accent:#4f8d68}
@media (prefers-color-scheme:dark){:root{--bg:#111715;--fg:#e7eee9;--muted:#94a19a}}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.7 'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;padding:24px;box-sizing:border-box}
main{max-width:380px;text-align:center}
.c{font-size:64px;font-weight:800;color:var(--accent);line-height:1}
h1{font-size:20px;margin:14px 0 6px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:13px 28px;border-radius:99px}
</style>
</head>
<body>
<main>
<div class="c">404</div>
<h1>ページが見つかりません</h1>
<p>アドレスが間違っているか、ページが移動した可能性があります。</p>
<a id="home" href="./">在庫管理アプリを開く</a>
</main>
<script>
/* プロジェクトページ（https://ユーザー名.github.io/リポジトリ名/）では、先頭の階層がアプリの場所です */
(function(){var seg=location.pathname.split('/')[1];if(/\.github\.io$/.test(location.hostname)&&seg){document.getElementById('home').href='/'+seg+'/'}else{document.getElementById('home').href='/'}})();
</script>
</body>
</html>
