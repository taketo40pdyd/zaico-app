<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* ---------- ログイン画面（全画面） ---------- */
.au{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--fg);display:flex;overflow-y:auto;animation:fadein .2s ease}
.au-side{display:none;flex:0 0 44%;background:linear-gradient(150deg,var(--accent) 0%,var(--teal) 100%);color:#fff;align-items:center;justify-content:center;padding:56px}
.au-sb{max-width:420px}.au-sb .au-logo{background:rgba(255,255,255,.18);margin-bottom:28px}
.au-sb h2{font-size:32px;line-height:1.35;font-weight:800;margin:0 0 14px}.au-sb p{margin:0 0 32px;opacity:.9;font-size:15px;line-height:1.7}
.au-sb ul{list-style:none;margin:0;padding:0;display:grid;gap:16px}.au-sb li{display:flex;gap:14px;align-items:flex-start}
.au-sb li i{flex:0 0 40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.au-sb li b{display:block;font-size:15px}.au-sb li span{display:block;font-size:13px;opacity:.85;margin-top:2px;line-height:1.5}
.au-main{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:calc(36px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));min-height:100%}
.au-main.busy{pointer-events:none}
.au-card{width:100%;max-width:400px;margin:auto}
.au-x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:22px;background:var(--fill);color:var(--fg);display:grid;place-items:center;z-index:2}
.au-logo{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center}
.au-h{font-size:27px;font-weight:800;margin:20px 0 6px;line-height:1.3}.au-sub{color:var(--muted);margin:0 0 22px;line-height:1.6}
.au-sub b{color:var(--fg);word-break:break-all}
.au-tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:16px;padding:4px;margin-bottom:20px}
.au-tabs::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--surface);border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);transition:transform .32s cubic-bezier(.3,.8,.3,1)}
.au-tabs[data-m="up"]::before{transform:translateX(100%)}
.au-tabs button{position:relative;z-index:1;transition:color .2s;height:42px;border-radius:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:0}
.au-tabs button[aria-selected="true"]{color:var(--fg)}
.au .btn[disabled]{opacity:.55}
.au .btn.au-g{background:var(--surface);color:var(--fg);border:1.5px solid var(--line)}
.au-or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:20px 0 2px}.au-or:before,.au-or:after{content:"";flex:1;height:1px;background:var(--line)}
.au .au-fl{margin:14px 2px 6px;font-size:14px}
.au-err{color:var(--danger);font-size:13px;margin:6px 2px 0}.au-err:empty{display:none}
.au-hint{color:var(--muted);font-size:12.5px;margin:6px 2px 0;line-height:1.5}
.au-alert{display:flex;gap:8px;align-items:flex-start;background:var(--danger-soft);color:var(--danger);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;margin:0 0 16px}
.au-alert svg{flex:0 0 auto;margin-top:2px}.au-alert.ok{background:var(--accent-soft);color:var(--accent-ink)}
.au-link{background:none;color:var(--accent-ink);font-weight:700;font-size:14px;padding:8px 2px}
.au-row{display:flex;justify-content:flex-end;margin-top:2px}
.au-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 2px 0}.au-meter i{height:5px;border-radius:3px;background:var(--line)}
.au-meter[data-s="1"] i:nth-child(-n+1){background:var(--danger)}
.au-meter[data-s="2"] i:nth-child(-n+2){background:var(--down)}
.au-meter[data-s="3"] i:nth-child(-n+3){background:var(--accent)}
.au-meter[data-s="4"] i{background:var(--accent)}
.au-ml{font-size:12.5px;color:var(--muted);margin:4px 2px 0;min-height:1.2em}
.au-note{color:var(--muted);font-size:12.5px;line-height:1.7;margin:18px 2px 0}
.au-foot{display:flex;justify-content:space-between;gap:12px;margin:14px 0 0;flex-wrap:wrap}
.au-vi{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
.au-eye{color:var(--muted)}
.au-spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:auspin .7s linear infinite;flex:0 0 auto}
@keyframes auspin{to{transform:rotate(360deg)}}

@media (min-width:900px){.au-side{display:flex}.au-main{padding-top:40px}}

/* ---------- ログイン画面のアニメーション ---------- */
.au-card>*{animation:auin .55s cubic-bezier(.2,.8,.2,1) both}
.au-card>:nth-child(1){animation-delay:0.02s}.au-card>:nth-child(2){animation-delay:0.07s}.au-card>:nth-child(3){animation-delay:0.12s}.au-card>:nth-child(4){animation-delay:0.17s}.au-card>:nth-child(5){animation-delay:0.22s}.au-card>:nth-child(6){animation-delay:0.27s}.au-card>:nth-child(7){animation-delay:0.32s}.au-card>:nth-child(8){animation-delay:0.37s}.au-card>:nth-child(9){animation-delay:0.42s}.au-card>:nth-child(10){animation-delay:0.47s}.au-card>:nth-child(11){animation-delay:0.52s}.au-card>:nth-child(12){animation-delay:0.57s}
.au-card>.au-logo,.au-card>.au-vi,.au-card>.au-ck{animation-name:aupop;animation-duration:.65s}
.au-card.out{animation:auout .17s ease both}.au-card.out>*{animation:none}
.au-leave{animation:auleave .2s ease both;pointer-events:none}
.au .inp{transition:border-color .15s,box-shadow .2s}
.au .inp:focus-within{box-shadow:0 0 0 4px var(--accent-soft)}.au .inp.err:focus-within{box-shadow:0 0 0 4px var(--danger-soft)}
.au .inp.shake{animation:aushake .38s}
.au-err{animation:auerr .22s ease}.au-alert{animation:auerr .3s ease}
.au .btn,.au-x,.au-link{transition:transform .12s ease,opacity .2s,filter .2s,background .2s}
.au .btn:not([disabled]):active,.au-x:active{transform:scale(.97)}
@media (hover:hover){.au .btn:not([disabled]):hover{filter:brightness(1.06)}.au-x:hover{filter:brightness(.96)}.au-link:hover{opacity:.75}}
.au-meter i{transition:background .25s}
.au-vi{position:relative}.au-vi::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:aupulse 2.2s ease-out infinite}
.au-vi svg{animation:aubob 3s ease-in-out infinite}
.au-okv{display:flex;flex-direction:column;align-items:center;text-align:center}
.au-ck{color:var(--accent)}.au-ckc,.au-ckp{fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round}
.au-ckc{stroke-width:2.5;stroke-dasharray:151;stroke-dashoffset:151;animation:audraw .6s ease .05s forwards}
.au-ckp{stroke-width:3.5;stroke-dasharray:40;stroke-dashoffset:40;animation:audraw .4s ease .5s forwards}
.au-side{position:relative;overflow:hidden}
.au-side::before,.au-side::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);animation:aufloat 12s ease-in-out infinite alternate}
.au-side::before{width:420px;height:420px;top:-120px;right:-140px}
.au-side::after{width:320px;height:320px;bottom:-100px;left:-100px;animation-duration:15s;animation-delay:-4s}
.au-sb{position:relative;z-index:1}
.au-sb .au-logo{animation:aupop .7s cubic-bezier(.2,.8,.2,1) .05s both}
.au-sb>h2,.au-sb>p,.au-sb li{animation:auslide .7s cubic-bezier(.2,.8,.2,1) both}
.au-sb>h2{animation-delay:.15s}.au-sb>p{animation-delay:.23s}
.au-sb li:nth-child(1){animation-delay:.34s}.au-sb li:nth-child(2){animation-delay:.44s}.au-sb li:nth-child(3){animation-delay:.54s}
@keyframes auin{from{opacity:0;transform:translateY(14px)}}
@keyframes aupop{0%{opacity:0;transform:scale(.6) rotate(-8deg)}60%{opacity:1;transform:scale(1.08) rotate(2deg)}100%{transform:none}}
@keyframes auout{to{opacity:0;transform:translateY(-8px) scale(.985)}}

function calcKeys(s,press,map){
  const h=e=>{
    if(!s.isConnected){document.removeEventListener('keydown',h,true);return}
    if($('#sheets').lastElementChild!==s||e.ctrlKey||e.metaKey||e.altKey)return;
    const k=map[e.key];if(k===undefined)return;
    e.preventDefault();e.stopImmediatePropagation();press(k)};
  document.addEventListener('keydown',h,true);
}
function openCalc({title,value=0,onOk}){
  let ex=String(value),fresh=true;
  const ev=t=>{const m=t.match(/\d+|[+\-×÷]/g)||[];let sum=0,sg=1,cur=null,mop=null;
    for(const x of m){if(x==='+'||x==='-'){sum+=sg*(cur??0);cur=null;mop=null;sg=x==='+'?1:-1}
      else if(x==='×'||x==='÷')mop=x;
      else{const n=parseInt(x,10);if(cur===null)cur=n;else if(mop==='×')cur*=n;else if(mop==='÷')cur=n?cur/n:0;else cur=n;mop=null}}
    return Math.floor(sum+sg*(cur??0))};
  const keys=['C','÷','×','b','7','8','9','-','4','5','6','+','1','2','3','ok','0','00'],lab={b:'1文字消す','-':'引く','+':'足す','×':'かける','÷':'わる',ok:'決定'};
  const s=sheet(`<h3>${esc(title)}</h3><div class="cdisp" id="cd"><small id="cex"></small><output id="cres"></output></div><div class="pad">${keys.map(k=>k==='ok'?`<button class="ok" data-k="ok" id="cok">決定</button>`:`<button data-k="${k}" class="${'+-×÷'.includes(k)?'op':''} ${k==='0'?'z':''}" aria-label="${lab[k]||k}">${k==='b'?'⌫':k==='-'?'−':k}</button>`).join('')}</div><p class="cs" style="padding:10px 0 0;text-align:center">キーボードでも入力できます（Enterで決定）</p>`);
  const draw=()=>{const v=ev(ex);$('#cex',s).textContent=ex.replace(/-/g,'−');$('#cres',s).textContent=v;$('#cd',s).classList.toggle('neg',v<0);$('#cok',s).disabled=v<0};
  draw();
  const press=k=>{
    if(k==='ok'){const v=ev(ex);if(v<0)return;s.close();onOk(v);return}
    if(/^\d+$/.test(k)){if(fresh){ex=k==='00'?'0':k;fresh=false}else if(ex==='0')ex=k==='00'?'0':k;else if(ex.length<14)ex+=k}
    else if('+-×÷'.includes(k)){fresh=false;ex=/[+\-×÷]$/.test(ex)?ex.slice(0,-1)+k:ex+k}
    else if(k==='b'){fresh=false;ex=ex.slice(0,-1)||'0'}
    else if(k==='C'){fresh=false;ex='0'}
    draw();
  };
  s.onclick=e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k)};
  const map={Enter:'ok','=':'ok',Backspace:'b',Delete:'C',c:'C',C:'C','+':'+','-':'-','*':'×',x:'×',X:'×','/':'÷'};for(let i=0;i<10;i++)map[i]=String(i);
  calcKeys(s,press,map);
}
/* ---------- 電卓（税込・税抜つき） ---------- */
function openCalcTool(){
  if($('#sheets .ctool'))return;
  S.ui.calcHist=S.ui.calcHist||[];
  let ex='0',done=false;
  const RD={floor:['切り捨て',Math.floor],round:['四捨五入',Math.round],ceil:['切り上げ',Math.ceil]},rd=()=>RD[S.ui.calcRound]?S.ui.calcRound:'floor';
  const fx=n=>{n=+n.toFixed(10);return n.toLocaleString('ja-JP',{maximumFractionDigits:10})};
  const ev=t=>{const m=t.match(/\d+\.?\d*|\.\d+|[+\-×÷]/g)||[];let sum=0,sg=1,cur=null,mop=null;
    for(const x of m){if(x==='+'||x==='-'){sum+=sg*(cur??0);cur=null;mop=null;sg=x==='+'?1:-1}
      else if(x==='×'||x==='÷')mop=x;
      else{const n=parseFloat(x);if(cur===null)cur=n;else if(mop==='×')cur*=n;else if(mop==='÷'){if(!n)return NaN;cur/=n}else cur=n;mop=null}}
    return sum+sg*(cur??0)};
  const show=t=>t.replace(/\d+(\.\d*)?/g,n=>{const [a,b]=n.split('.');return Number(a).toLocaleString('ja-JP')+(b!==undefined?'.'+b:'')}).replace(/-/g,'−');
  const tax=[['in10','税込 10%'],['ex10','税抜 10%'],['in8','税込 8%'],['ex8','税抜 8%']];
  const keys=['C','b','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','00','.','='],lab={b:'1文字消す','-':'引く','+':'足す','×':'かける','÷':'わる','=':'計算する','%':'パーセント'};
  const sh=sheet(`<div class="ctool"><h3>電卓</h3><div class="cdisp" id="cd"><small id="cex"></small><output id="cres"></output></div><div class="ctax">${tax.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('')}</div><div class="pad">${keys.map(k=>`<button data-k="${k}" class="${'+-×÷%'.includes(k)?'op':''} ${k==='='?'eq':''}" aria-label="${lab[k]||k}">${k==='b'?'⌫':k==='-'?'−':k}</button>`).join('')}</div><div class="crow"><div class="cseg"><span>端数</span>${Object.entries(RD).map(([k,[l]])=>`<button data-rd="${k}">${l}</button>`).join('')}</div><button class="chip" id="ccp">結果をコピー</button></div><div id="chist"></div></div>`);
  const draw=()=>{const v=ev(ex);$('#cex',sh).textContent=show(ex);$('#cres',sh).textContent=isNaN(v)?'エラー':fx(v);
    sh.querySelectorAll('[data-rd]').forEach(b=>b.classList.toggle('on',b.dataset.rd===rd()));
    const hl=S.ui.calcHist;$('#chist',sh).innerHTML=hl.length?`<div class="hh"><b>履歴</b><button data-hc="1">消去</button></div>`+hl.map((h,i)=>`<button class="hrow" data-h="${i}"><span>${esc(h.e)}</span><b>${fx(h.r)}</b></button>`).join(''):''};
  const log=(e,r)=>{S.ui.calcHist=[{e,r},...S.ui.calcHist].slice(0,8);save()};
  const val=()=>{const v=ev(ex);return isNaN(v)?null:v};
  const press=k=>{
    if(/^\d+$/.test(k)){if(done){ex='0';done=false}const m=ex.match(/[\d.]+$/);if(ex==='0'||(m&&m[0]==='0'))ex=ex.slice(0,-1)+(k==='00'?'0':k);else if(ex.length<30)ex+=k}
    else if(k==='.'){if(done){ex='0';done=false}const m=ex.match(/[\d.]+$/);if(!m)ex+='0.';else if(!m[0].includes('.'))ex+='.'}
    else if('+-×÷'.includes(k)){done=false;ex=/[+\-×÷]$/.test(ex)?ex.slice(0,-1)+k:ex+k}
    else if(k==='%'){const m=ex.match(/\d+\.?\d*$/);if(m)ex=ex.slice(0,-m[0].length)+String(+(parseFloat(m[0])/100).toFixed(10))}
    else if(k==='b'){if(done){ex='0';done=false}else ex=ex.slice(0,-1)||'0'}
    else if(k==='C'){ex='0';done=false}
    else if(k==='='){const v=val();if(v===null||!/[+\-×÷]/.test(ex.replace(/^-/,'')))return;log(show(ex),+v.toFixed(10));ex=String(+v.toFixed(10));done=true}
    draw()};
  sh.onclick=async e=>{
    const k=e.target.closest('[data-k]');if(k){press(k.dataset.k);return}
    const t=e.target.closest('[data-t]');if(t){const v=val();if(v===null)return;const q=t.dataset.t,r=RD[rd()][1],n=q==='in10'?r(v*1.1):q==='ex10'?r(v/1.1):q==='in8'?r(v*1.08):r(v/1.08);log(`${fx(v)} → ${tax.find(x=>x[0]===q)[1]}`,n);ex=String(n);done=true;draw();return}
    const d=e.target.closest('[data-rd]');if(d){S.ui.calcRound=d.dataset.rd;save();draw();return}
    const h=e.target.closest('[data-h]');if(h){ex=String(S.ui.calcHist[+h.dataset.h].r);done=true;draw();return}
    if(e.target.closest('[data-hc]')){S.ui.calcHist=[];save();draw();return}
    if(e.target.closest('#ccp')){const v=val();if(v===null)return;toast((await copyText(String(+v.toFixed(10))))?`${fx(v)} をコピーしました`:'コピーできませんでした')}};
  const map={Enter:'=','=':'=',Backspace:'b',Delete:'C',c:'C',C:'C','+':'+','-':'-','*':'×',x:'×',X:'×','/':'÷','%':'%','.':'.'};for(let i=0;i<10;i++)map[i]=String(i);
  calcKeys(sh,press,map);draw();
}
function shrink(file,max=320){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}
async function saveFile(filename,data){
  let d;try{d=await claude.use('downloads')}catch(e){d=null}
  if(!d){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('保存しました')}catch(e){toast('この画面ではファイルを保存できません')}return}
  try{await d.save({filename,data});toast('保存しました')}catch(e){if(e&&e.code!=='declined')toast('保存できませんでした')}
}

function repData(){
  const r=T.rep,now=new Date();let a,b,n,idx,title,labels;
  const dayIdx=t=>Math.round((+sod(t)-+a)/DAY);
  if(r.mode==='day'){a=new Date(now.getFullYear(),now.getMonth(),now.getDate()+r.off);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1);n=24;idx=t=>new Date(t).getHours();title=(r.off===0?'今日':'')+`（${a.getFullYear()}年${a.getMonth()+1}月${a.getDate()}日）`;labels=i=>`${i}時`}
  else if(r.mode==='week'){const c=sod(now),diff=(c.getDay()-S.weekStart+7)%7;a=new Date(c.getFullYear(),c.getMonth(),c.getDate()-diff+r.off*7);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7);n=7;idx=dayIdx;const e=new Date(+b-DAY);title=(r.off===0?'今週':'')+`（${a.getMonth()+1}/${a.getDate()}〜${e.getMonth()+1}/${e.getDate()}）`;labels=i=>{const d=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i);return `${d.getMonth()+1}/${d.getDate()}`}}
  else if(r.mode==='month'){a=new Date(now.getFullYear(),now.getMonth()+r.off,1);b=new Date(a.getFullYear(),a.getMonth()+1,1);n=Math.round((+b-+a)/DAY);idx=t=>new Date(t).getDate()-1;title=(r.off===0?'今月':'')+`（${a.getFullYear()}年${a.getMonth()+1}月）`;labels=i=>`${a.getMonth()+1}/${i+1}`}
  else{a=new Date(r.from+'T00:00:00');let e=new Date(r.to+'T00:00:00');if(isNaN(+a))a=sod(now);if(isNaN(+e)||e<a)e=a;n=Math.min(92,Math.round((+e-+a)/DAY)+1);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+n);idx=dayIdx;title=`${a.getMonth()+1}/${a.getDate()}〜${new Date(+b-DAY).getMonth()+1}/${new Date(+b-DAY).getDate()}`;labels=i=>{const d=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i);return `${d.getMonth()+1}/${d.getDate()}`}}
  const inc=Array(n).fill(0),dec=Array(n).fill(0),per={};let ci=0,cd=0;
  const logs=S.log.filter(l=>l.type==='qty'&&l.t>=+a&&l.t<+b);
  logs.forEach(l=>{const i=idx(l.t);if(i<0||i>=n)return;const p=per[l.itemId||l.name]||(per[l.itemId||l.name]={name:l.name,i:0,d:0});if(l.delta>0){inc[i]+=l.delta;ci++;p.i+=l.delta}else{dec[i]-=l.delta;cd++;p.d-=l.delta}});
  return {a,b,n,inc,dec,ci,cd,ti:inc.reduce((s,x)=>s+x,0),td:dec.reduce((s,x)=>s+x,0),title,labels,per:Object.values(per).sort((x,y)=>(y.i+y.d)-(x.i+x.d)).slice(0,5),logs};
}
function chartSVG(R){
  const W=340,H=210,L=30,Rr=6,Tp=10,B=26,iw=W-L-Rr,ih=H-Tp-B,n=R.n,mx=Math.max(1,...R.inc,...R.dec);
  let step=1;for(const s of [1,2,5,10,20,25,50,100,200,500,1000,2000,5000]){if(s*4>=mx){step=s;break}step=s*2}
  const nm=step*4,bw=iw/n,y=v=>Tp+ih-ih*v/nm;
  let g='';for(let k=0;k<=4;k++){const v=step*k;g+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`}
  let bars='';
  for(let i=0;i<n;i++){const x0=L+i*bw,w=Math.max(1.2,bw*.36),gap=bw*.1;
    if(!R.inc[i]&&!R.dec[i]){bars+=`<rect class="dot" x="${x0+bw/2-Math.min(3,bw/3)}" y="${y(0)-Math.min(6,bw*.6)}" width="${Math.min(6,bw*.6)}" height="${Math.min(6,bw*.6)}" rx="1.5"/>`;continue}
    if(R.inc[i])bars+=`<rect class="bu" x="${x0+gap}" y="${y(R.inc[i])}" width="${w}" height="${y(0)-y(R.inc[i])}" rx="1.5"/>`;
    if(R.dec[i])bars+=`<rect class="bdn" x="${x0+bw-gap-w}" y="${y(R.dec[i])}" width="${w}" height="${y(0)-y(R.dec[i])}" rx="1.5"/>`;}
  const cnt=Math.min(n,n>12?6:n),lab=[];for(let k=0;k<cnt;k++)lab.push(cnt===1?0:Math.round(k*(n-1)/(cnt-1)));
  let xl='';[...new Set(lab)].forEach(i=>xl+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${R.labels(i)}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="増加と減少の推移グラフ">${g}${bars}${xl}</svg>`;
}

/* ---------- analysis ---------- */
function analysis(days){
  const from=Date.now()-days*DAY,pf=from-days*DAY,pm=new Map(),m=new Map();act().forEach(i=>m.set(i.id,{i,out:0,inn:0,net:0}));
  S.log.forEach(l=>{if(l.type==='qty'&&l.delta<0&&l.t>=pf&&l.t<from)pm.set(l.itemId,(pm.get(l.itemId)||0)-l.delta)});
  S.log.forEach(l=>{if(l.type!=='qty'||l.t<from)return;const r=m.get(l.itemId);if(!r)return;r.net+=l.delta;if(l.delta<0)r.out-=l.delta;else r.inn+=l.delta});
  const rows=[...m.values()].map(r=>{const i=r.i,start=i.qty-r.net,avg=Math.max((start+i.qty)/2,0),unit=curPrice(i)!=null?curPrice(i):num(i.cost)!=null?i.cost:null,turn=avg>0?r.out/avg:(r.out>0?r.out:0);
    return {...r,prev:pm.get(i.id)||0,unit,val:unit!=null?r.out*unit:null,turn,dd:r.out>0&&turn>0?Math.round(days/turn):null,stock:num(i.cost)!=null?i.cost*i.qty:null}});
  const useVal=rows.some(r=>r.val!=null&&r.val>0),b=r=>useVal?(r.val||0):r.out;
  const act2=rows.filter(r=>b(r)>0).sort((x,y)=>b(y)-b(x)),tot=act2.reduce((s,r)=>s+b(r),0);let cum=0;
  act2.forEach(r=>{const prev=cum/tot;cum+=b(r);r.cum=cum/tot;r.cls=prev<.7?'A':prev<.9?'B':'C'});
  const dead=rows.filter(r=>b(r)<=0).map(r=>{r.cls='D';return r}).sort((x,y)=>(y.stock||0)-(x.stock||0)||y.i.qty-x.i.qty);
  return {rows:[...act2,...dead],act:act2,dead,useVal,tot,outQ:rows.reduce((t,r)=>t+r.out,0),prevQ:rows.reduce((t,r)=>t+r.prev,0)};
}
function paretoSVG(A){

  let bars='',pts=[];d.forEach((r,i)=>{const v=A.useVal?r.val:r.out,h=ih*v/mx,x=L+i*bw;bars+=`<rect x="${x+bw*.15}" y="${Tp+ih-h}" width="${bw*.7}" height="${h}" rx="2" fill="${col(r.cls)}"/>`;pts.push(`${x+bw/2},${Tp+ih-ih*r.cum}`)});
  return `<svg class="pareto" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="ABC分析のパレート図"><line class="gl" x1="${L}" x2="${W-Rr}" y1="${Tp+ih*.3}" y2="${Tp+ih*.3}" stroke-dasharray="3 3"/><text x="${W-Rr}" y="${Tp+ih*.3-3}" text-anchor="end">70%</text>${bars}<polyline class="ln2" points="${pts.join(' ')}"/><text x="${L}" y="${H-6}">棒：${A.useVal?'出庫金額':'出庫数'}　線：累計の割合　（上位${d.length}件）</text></svg>`;

function trendSVG(){

function openLightbox(imgs,start,name){
  const o=document.createElement('div');o.className='glb';o.setAttribute('role','dialog');o.setAttribute('aria-label',name+'の写真');
  o.innerHTML=`<div class="glbt"><span id="glbc"></span><button class="glbx" aria-label="閉じる">×</button></div><div class="glbs">${imgs.map((u,i)=>`<img src="${u}" alt="${esc(name)} ${i+1}/${imgs.length}">`).join('')}</div>${imgs.length>1?'<button class="glbn l" aria-label="前の写真">‹</button><button class="glbn r" aria-label="次の写真">›</button>':''}`;
  document.body.appendChild(o);const sc=o.querySelector('.glbs'),cur=()=>Math.round(sc.scrollLeft/sc.clientWidth);
  const go=i=>sc.scrollTo({left:Math.max(0,Math.min(imgs.length-1,i))*sc.clientWidth,behavior:'smooth'}),upd=()=>{o.querySelector('#glbc').textContent=`${cur()+1} / ${imgs.length}`};
  const kd=e=>{if(e.key==='Escape'){e.stopPropagation();e.preventDefault();close()}else if(e.key==='ArrowRight')go(cur()+1);else if(e.key==='ArrowLeft')go(cur()-1)};
  const close=()=>{document.removeEventListener('keydown',kd,true);o.remove()};
  document.addEventListener('keydown',kd,true);sc.scrollLeft=start*sc.clientWidth;upd();sc.addEventListener('scroll',upd);
  o.onclick=e=>{if(e.target.closest('.glbx')||e.target===sc)close();else if(e.target.closest('.glbn.l'))go(cur()-1);else if(e.target.closest('.glbn.r'))go(cur()+1)};
}

function bkStore(l){while(l.length){try{localStorage.setItem(BKEY,JSON.stringify(l));return true}catch(e){const i=l.findIndex(x=>x.auto);l.splice(i>=0?i:0,1)}}try{localStorage.removeItem(BKEY)}catch(e){}return false}
function bkAdd(label,auto){const l=bkLoad();l.push({id:uid(),t:Date.now(),label,auto,n:S.items.length,json:JSON.stringify(S)});
  return bkStore([...l.filter(x=>x.auto).slice(-6),...l.filter(x=>!x.auto).slice(-6)].sort((a,b)=>a.t-b.t))}

/* ---------- forecast ---------- */
function forecast(days){
  const now=Date.now(),from=now-days*DAY,out={};
  S.log.forEach(l=>{if(l.type==='qty'&&l.delta<0&&l.t>=from&&l.itemId)out[l.itemId]=(out[l.itemId]||0)-l.delta});
  const first=S.log.length?Math.min(...S.log.map(l=>l.t)):now,win=Math.max(7,Math.min(days,Math.ceil((now-first)/DAY))),t0=+sod(now);
  return act().filter(i=>!isBun(i)).map(i=>{const rate=(out[i.id]||0)/win,pos=S.pos.filter(o=>o.status==='open'&&o.itemId===i.id&&o.eta);let runout=null,reorder=null;
    if(rate>0){for(let d=0;d<=365;d++){const dt=ymd(new Date(t0+d*DAY)),st=i.qty-rate*d+pos.filter(o=>o.eta<=dt).reduce((s,o)=>s+o.qty,0);if(reorder==null&&st<=minOf(i))reorder=d;if(st<=0){runout=d;break}}}
    return {i,rate,runout,reorder,win,t0}});
}

}

/* ---------- reorder point suggestions ---------- */
function reorderSuggest(days,lead,safety){
  const now=Date.now(),from=now-days*DAY,out={};
  S.log.forEach(l=>{if(l.type==='qty'&&l.delta<0&&l.t>=from&&l.itemId&&!['棚卸し調整','返品'].includes(l.tag))out[l.itemId]=(out[l.itemId]||0)-l.delta});
  const first=S.log.length?Math.min(...S.log.map(l=>l.t)):now,win=Math.max(7,Math.min(days,Math.ceil((now-first)/DAY)));
  return act().filter(i=>!isBun(i)).map(i=>{
    const x=S.partners.find(p=>p.id===i.sup&&p.kind==='仕入先'),own=x?num(x.lead):null,hasOwn=own!=null&&own>0,ld=hasOwn?own:lead,
      o=out[i.id]||0,rate=o/win,cur=minOf(i),sug=rate>0?Math.max(1,Math.ceil(rate*(ld+safety))):null;
    return {i,rate,ld,hasOwn,o,win,cur,sug,diff:sug==null?0:sug-cur};
  });
}

function partnerStat(name,from){

  L.forEach(l=>{const i=find(l.itemId),a=Math.abs(l.delta),u=l.delta>0?num(i&&i.cost):(i?num(curPrice(i)):null);q+=a;if(u!=null)amt+=u*a;it[l.name]=(it[l.name]||0)+a});

}

function monthStats(off){
  const [a,b]=monthRange(off),r={a,b,inQ:0,outQ:0,adjQ:0,buy:0,sales:0,gp:0,days:Array.from({length:new Date(b-1).getDate()},()=>({i:0,o:0})),inI:{},outI:{},ptn:{},cnt:0};
  S.log.forEach(l=>{if(l.type!=='qty'||l.t<a||l.t>=b)return;const it=find(l.itemId),d=new Date(l.t).getDate()-1,q=Math.abs(l.delta);
    if(l.tag==='棚卸し調整'){r.adjQ+=l.delta;return}
    if(l.delta>0){if(PUR_EXCL.includes(l.tag))return;r.cnt++;r.inQ+=q;r.days[d].i+=q;r.inI[l.name]=(r.inI[l.name]||0)+q;const c=num(it&&it.cost);if(c!=null)r.buy+=c*q;if(l.partner)r.ptn[l.partner]=(r.ptn[l.partner]||0)+q}
    else{r.cnt++;r.outQ+=q;r.days[d].o+=q;r.outI[l.name]=(r.outI[l.name]||0)+q;const pr=it?num(curPrice(it)):null,c=num(it&&it.cost);if(pr!=null)r.sales+=pr*q;if(pr!=null&&c!=null)r.gp+=(pr-c)*q}});
  return r;
}
function stockValueAt(t){const dl={};S.log.forEach(l=>{if(l.type==='qty'&&l.t>=t)dl[l.itemId]=(dl[l.itemId]||0)+l.delta});let v=0,q=0;act().forEach(i=>{if(isBun(i))return;const n=Math.max(0,i.qty-(dl[i.id]||0));q+=n;const c=num(i.cost);if(c!=null)v+=c*n});return {v,q}}

function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','||c==='\t'){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}

function openSOEdit(id,done){

    if(ex)Object.assign(ex,o);else S.orders.push(o);save();toast('受注を保存しました');p.close();done&&done()};
}
function openSODetail(id,done){
  let o=S.orders.find(x=>x.id===id);if(!o)return;
  const p=page('受注の詳細',{left:'戻る',right:o.st==='open'?'編集':''},'<div id="sd"></div>');
  const draw=()=>{o=S.orders.find(x=>x.id===id);if(!o){p.close();return}
    const sh=soAlloc()[o.id]||{},tot=o.lines.reduce((t,l)=>t+(l.unit!=null?l.unit*l.qty:0),0),q=o.lines.reduce((t,l)=>t+l.qty,0);
    $('#sd',p).innerHTML=`<div class="dtitle"><h1>${esc(o.customer)}</h1></div><div style="display:flex;gap:6px;flex-wrap:wrap"><em class="pill smp" style="font-style:normal">${SOST[o.st]}</em>${o.st==='open'&&Object.keys(sh).length?'<em class="pill out" style="font-style:normal">在庫不足あり</em>':''}</div>

    <h3 class="sec">注文の内容</h3><div class="qc">${o.lines.map((l,i)=>{const it=find(l.itemId);return `<div class="kv"><span>${esc(l.name)}<small class="ordl">${l.unit!=null?yen(l.unit)+' × '+l.qty:l.qty+'個'}${o.st==='open'?'・在庫 '+(it?it.qty:0)+'個':''}</small></span><span style="${sh[i]?'color:var(--danger)':''}">${l.qty}個${sh[i]?`<small class="ordl">不足 ${sh[i]}個</small>`:''}</span></div>`}).join('')}<div class="kv"><span>合計</span><span>${q}個${tot?'・'+yen(tot):''}</span></div></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">${o.st==='open'?`<button class="btn" data-a="ship">${ic('truck',20)}出荷する（在庫から引く）</button>`:''}<button class="btn ghost" data-a="docs">${ic('clip',20)}納品書・請求書などを作る</button>${o.st==='open'?'<button class="btn ghost" style="color:var(--danger)" data-a="cancel">キャンセルにする</button>':o.st==='canceled'?'<button class="btn ghost" data-a="reopen">受付中に戻す</button>':''}<button class="btn ghost" style="color:var(--danger)" data-a="del">この受注を削除</button></div>`};
  draw();
  $('[data-x=r]',p).onclick=()=>{if(o&&o.st==='open')openSOEdit(id,()=>{draw();done&&done()})};
  p.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||!o)return;const a=b.dataset.a;if(deny(false))return;
    if(a==='ship'){const bad=o.lines.filter(l=>{const it=find(l.itemId);return !it||it.trashed||it.qty<l.qty});
      if(bad.length){toast(`在庫が足りません：${bad.slice(0,2).map(l=>l.name).join('、')}${bad.length>2?' ほか':''}`);return}
      if(!await ask('出荷しますか？',`${o.lines.length}点の在庫を引きます。`,'出荷する'))return;
      o.lines.forEach(l=>{const it=find(l.itemId);if(setQty(it,it.qty-l.qty,'販売',o.customer))S.log[S.log.length-1].note=o.no});
      o.st='shipped';o.shippedAt=Date.now();save();draw();done&&done();
      slipSheet({isIn:false,rows:o.lines.map(l=>({name:l.name,code:(find(l.itemId)||{}).barcode||'',qty:l.qty,unit:l.unit})),partner:o.customer,tag:'販売'})}
    else if(a==='docs')openDocMaker(o.lines.map(l=>({it:find(l.itemId),n:l.qty,u:l.unit})).filter(x=>x.it),o.customer);
    else if(a==='cancel'){if(await ask('キャンセルにしますか？','引当が解除されます。','キャンセルにする',true)){o.st='canceled';save();draw();done&&done()}}
    else if(a==='reopen'){o.st='open';save();draw();done&&done()}
    else if(a==='del'){if(await ask('この受注を削除しますか？','出荷済みの場合も、在庫は元に戻りません。','削除する',true)){S.orders=S.orders.filter(x=>x.id!==id);save();p.close();done&&done()}}});

function openSchedule(){
  const p=page('入出荷スケジュール',{left:'戻る'},'<div id="sb"></div>');
  const draw=()=>{const t0=ymd(new Date()),end=ymd(new Date(Date.now()+14*DAY)),ev={},add=(d,e)=>(ev[d||'未定']=ev[d||'未定']||[]).push(e);
    openPOs().forEach(o=>add(o.eta,{k:'in',id:o.id,t:o.name,s:`入荷予定 ${o.qty}個${o.partner?'・'+o.partner:''}`,late:poLate(o)}));
    S.orders.filter(o=>o.st==='open').forEach(o=>add(o.due,{k:'out',id:o.id,t:o.customer||'受注',s:`出荷予定 ${(o.lines||[]).reduce((s,l)=>s+(+l.qty||0),0)}個`,late:!!o.due&&o.due<t0}));
    const ks=Object.keys(ev).filter(d=>d!=='未定').sort(),shown=ks.filter(d=>d<=end),later=ks.filter(d=>d>end).reduce((s,d)=>s+ev[d].length,0);
    const all=Object.values(ev).flat(),row=e=>`<button class="mr" data-k="${e.k}" data-id="${e.id}" style="width:100%;text-align:left"><span class="ib ${e.k==='in'?'blue':'orange'}" style="width:40px;height:40px;border-radius:12px">${ic(e.k==='in'?'cube':'truck',20)}</span><div class="rm"><b>${esc(e.t)}</b><small>${esc(e.s)}${e.late?'・遅れています':''}</small></div></button>`;
    $('#sb',p).innerHTML=`<div class="val"><div><small>入荷待ち</small><b>${all.filter(e=>e.k==='in').length}件</b></div><div><small>出荷待ち</small><b>${all.filter(e=>e.k==='out').length}件</b></div><div><small>遅れ</small><b style="${all.some(e=>e.late)?'color:var(--danger)':''}">${all.filter(e=>e.late).length}件</b></div></div>`
    +(shown.length?shown.map(d=>`<h3 class="sec" style="margin-top:18px">${d<t0?'⚠ ':''}${fmtDate(+new Date(d+'T00:00:00'))}${d===t0?'（今日）':''}</h3>`+ev[d].map(row).join('')).join(''):'<div class="empty"><h3>2週間以内の予定はありません</h3><p>入荷予定や受注を登録すると、ここに日ごとに並びます。</p></div>')
    +(later?`<p class="cs" style="margin-top:14px">15日以降の予定が ${later}件あります（カレンダーで確認できます）。</p>`:'')
    +(ev['未定']?`<h3 class="sec" style="margin-top:18px">日付未定</h3>`+ev['未定'].map(row).join(''):'')};
  draw();
  p.onclick=e=>{const b=e.target.closest('.mr[data-id]');if(!b)return;b.dataset.k==='in'?receivePO(b.dataset.id,draw):openSODetail(b.dataset.id,draw)};
}

const SY={doc:null,un:null,tm:0,id:uid(),last:'',big:0};
const SK=['ui','flags','theme','scans','autoBk','user','home','notif'];
function syncPack(){const o=JSON.parse(core());SK.forEach(k=>delete o[k]);o.items.forEach(i=>i.images=(i.images||[]).filter(u=>!u.startsWith('data:')));return JSON.stringify(o)}
const dataBlob=u=>{const m=u.match(/^data:([^;]+);base64,(.*)$/);if(!m)return null;const b=atob(m[2]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:m[1]})};
async function syncImgs(){if(!SY.as)return;let ch=0;for(const it of S.items)for(let k=0;k<(it.images||[]).length;k++){const u=it.images[k];if(!u.startsWith('data:'))continue;const bl=dataBlob(u);if(!bl)continue;try{const r=await SY.as.upload(bl);it.images[k]=r.url;ch++}catch(e){return}}if(ch)localStorage.setItem(KEY,JSON.stringify(S))}
function syncPush(now){if(!SY.doc||!S.flags.sync)return;clearTimeout(SY.tm);SY.tm=setTimeout(async()=>{await syncImgs();const j=syncPack();if(j===SY.last)return;
  if(j.length>240000){if(!SY.big){SY.big=1;toast('データが大きいため共有できません（古い履歴を整理してください）')}return}SY.big=0;const t=Date.now();
  try{await SY.doc.set({json:j,t,by:SY.id,who:S.user.name});SY.last=j;S.flags.syncT=t;S.flags.syncSeen=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('共有データを保存できませんでした（編集権限が必要です）')}},now?0:1500)}
function applyRemote(d){try{const n=JSON.parse(d.json),im={},old={};S.items.forEach(i=>{im[i.id]=i.images||[];old[i.id]=i.qty});let ch=0,nw=0;n.items.forEach(i=>{i.images=[...(i.images||[]),...(im[i.id]||[]).filter(u=>u.startsWith('data:'))];if(!(i.id in old))nw++;else if(old[i.id]!==i.qty)ch++});const k={};SK.forEach(x=>k[x]=S[x]);S=Object.assign(n,k);S.flags.syncT=d.t;S.flags.syncSeen=Date.now();S.flags.sync=true;const msg=`${d.who||'だれか'}さんが更新：在庫の変更 ${ch}件${nw?`・新規 ${nw}件`:''}`;S.flags.syncLog=[{t:Date.now(),who:d.who||'',m:`在庫の変更 ${ch}件${nw?`・新規 ${nw}件`:''}`},...(S.flags.syncLog||[])].slice(0,20);prevSnap=core();SY.last=syncPack();localStorage.setItem(KEY,JSON.stringify(S));refresh();toast(msg,1)}catch(e){}}
async function startSync(manual){
  let db=null,fbDoc=null;
  if(FB.on()){fbDoc=await FB.doc(manual);if(!fbDoc)return}
  else{
  try{db=window.claude?await claude.use('db'):null}catch(e){}
  if(!db){S.flags.sync=false;persist();if(manual)toast('この画面ではデータ共有を使えません。公開ページとして開くか、Firebase連携を設定してください');refresh();return}
  try{SY.as=await claude.use('assets')}catch(e){}}
  SY.un&&SY.un();SY.doc=fbDoc||db.doc('shared/zaiko');S.flags.sync=true;persist();let first=true;
  SY.un=SY.doc.onSnapshot(async snap=>{const d=snap.exists?snap.data():null;
    if(!d||!d.json){if(first){first=false;syncPush(true)}return}
    if(d.by===SY.id)return;if(d.t<=(S.flags.syncT||0)){first=false;S.flags.syncSeen=Date.now();return}
    if(first&&!S.flags.syncT&&S.items.some(i=>!i.sample)&&!await ask('共有データがあります','この端末のデータを、共有されている内容で置き換えます。よろしいですか？','置き換える',true)){first=false;SY.un&&SY.un();SY.doc=null;S.flags.sync=false;persist();refresh();return}
    first=false;applyRemote(d)},()=>toast('データ共有に接続できませんでした'));
  if(manual){toast('データ共有をオンにしました');refresh()}
}

async function plHash(code,salt){
  const t=salt+':'+code;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return 'f'+h.toString(16)}
}

function plAsk(title,sub){return new Promise(res=>{

  const sh=sheet(`<h3 style="text-align:center">${esc(title)}</h3><p class="cs" style="text-align:center;padding-top:0">${esc(sub||'4桁の数字を入力してください')}</p><div class="pld" id="pld">${plDots(0)}</div>${plPad()}<button class="btn ghost" id="plc" style="margin-top:14px">キャンセル</button>`);
  const fin=v=>{if(done)return;done=true;sh.close();res(v)};

  sh.onclick=e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k);if(e.target.closest('#plc'))fin(null)};

function plShow(){

    if(e.target.closest('#plx')){buf='';view();return}

    name:()=>form({title:'表示名の変更',desc:'メンバーに表示される名前です。',fields:[{id:'n',label:'表示名',ac:'name',max:30,val:FB.user.displayName||'',opt:true}],ok:'保存',
      run:async v=>{await FB.AU.updateProfile(FB.user,{displayName:v.n.trim()||null})},done:()=>{draw();toast('表示名を保存しました')}}),
    pw:()=>form({title:'パスワードの変更',fields:[curF,...newF],ok:'変更する',check:pwCheck,
      run:async v=>{await reauth(v.cur);await FB.AU.updatePassword(FB.user,v.np)},done:()=>toast('パスワードを変更しました')}),
    setpw:()=>form({title:'パスワードの設定',desc:'設定すると、Googleのほかに、メールアドレスとパスワードでもログインできます。',fields:newF,ok:'設定する',check:pwCheck,
      run:async v=>{const AU=FB.AU;await recent(()=>AU.linkWithCredential(FB.user,AU.EmailAuthProvider.credential(FB.user.email,v.np)))},done:()=>{draw();toast('パスワードを設定しました')}}),
    mail:()=>form({title:'メールアドレスの変更',desc:'新しいアドレスに確認メールを送ります。リンクを開くと変更が完了します。共有メンバーには、新しいアドレスを自動で追加します。',
      fields:[curF,{id:'ne',label:'新しいメールアドレス',type:'email',ac:'email'}],ok:'確認メールを送る',
      check:(v,E)=>{const m=v.ne.trim().toLowerCase();if(!RE.test(m))E('ne','メールアドレスの形式が正しくありません');else if(m===FB.me())E('ne','現在のアドレスと同じです')},
      run:async v=>{const m=v.ne.trim().toLowerCase();await reauth(v.cur);
        try{await FB.F.setDoc(FB.ref(),{allowed:FB.F.arrayUnion(FB.me(),m)},{merge:true})}catch(e){}
        await FB.AU.verifyBeforeUpdateEmail(FB.user,m);sent=m},
      done:()=>info('確認メールを送りました',sent+' に届いたリンクを開くと、変更が完了します。完了後は、新しいアドレスでログインしてください。')}),
    reset:async()=>{if(!await ask('再設定メールを送りますか？',FB.user.email+' に、パスワード再設定用のメールを送ります。','送る'))return;
      try{await FB.AU.sendPasswordResetEmail(FB.auth,FB.user.email);toast('再設定メールを送りました')}catch(e){toast(EX[e&&e.code]||fbErr(e))}},
    sync:async()=>{await ACT.sync();draw();setTimeout(draw,900)},
    mem:()=>openFbMembers(),log:()=>ACT.synclog(),cfg:()=>openFbCfg(),rules:()=>fbRulesSheet(),
    out:async()=>{if(!await ask('ログアウトしますか？','データ共有はオフになります。この端末の在庫データは残ります。','ログアウト'))return;el.close();await FB.signOut();toast('ログアウトしました')},
    del:()=>form({title:'アカウントの削除',danger:true,desc:'アカウントを完全に削除します。この操作は取り消せません。この端末の在庫データは残りますが、データ共有はオフになります。共有メンバーの一覧に残るメールアドレスは、他のメンバーが削除できます。',
      fields:[...(hasPw()?[curF]:[]),{id:'cf',label:'確認のため「削除」と入力してください',ph:'削除'}],ok:'削除する',
      check:(v,E)=>{if(v.cf.trim()!=='削除')E('cf','「削除」と入力してください')},
      run:async v=>{await reauth(hasPw()?v.cur:null);await FB.AU.deleteUser(FB.user);SY.un&&SY.un();SY.un=null;SY.doc=null;S.flags.sync=false;persist();FB.user=null},
      done:()=>{el.close();refresh();toast('アカウントを削除しました')}})
  };
  el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a]()});
  const draw=()=>{
    if(!FB.user){el.close();return}
    const u=FB.user,name=u.displayName||'',ini=(name||u.email||'?').trim().charAt(0).toUpperCase(),ver=u.emailVerified,pw=hasPw(),on=!!S.flags.sync;
    const prov=u.providerData.map(p=>PROV[p.providerId]||p.providerId).join('・')||'—',mt=u.metadata||{};
    $('#acin',el).innerHTML=`<div class="ac-hero"><div class="ac-av"><span>${esc(ini)}</span>${u.photoURL?`<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div><div class="ac-name">${esc(name||String(u.email).split('@')[0])}</div><div class="ac-mail">${esc(u.email)}</div><div class="ac-chips"><span class="ac-chip ${ver?'ok':'warn'}">${ver?ic('check',14)+'確認済み':'メール未確認'}</span><span class="ac-chip">${esc(prov)}</span></div></div>
    <h3 class="mg">プロフィール</h3><div class="card">${row('name','user','表示名','メンバーに表示されます',name||'未設定')}</div>
    <h3 class="mg">データ共有</h3><div class="card">${row('sync','phone','データ共有',on?(S.flags.syncSeen?'最終更新 '+hm(S.flags.syncSeen):'同期しています'):'この端末のデータだけを使っています',on?'オン':'オフ')}${row('mem','users','共有メンバー','招待・削除','')}${on?row('log','history','共有の更新履歴','他の人がいつ何を変えたか',''):''}</div>
    <h3 class="mg">セキュリティ</h3><div class="card">${pw?row('pw','lock','パスワードを変更','','')+row('mail',MAIL26,'メールアドレスを変更','確認メールで変更します','')+row('reset','lock','パスワード再設定メール','忘れたときに、登録アドレスへ送ります',''):row('setpw','lock','パスワードを設定','メールアドレスでもログインできるようになります','')}</div>
    <h3 class="mg">アカウント情報</h3><div class="card ac-kv"><div class="kv"><span>ログイン方法</span><span>${esc(prov)}</span></div><div class="kv"><span>登録日</span><span>${esc(fmt(mt.creationTime))}</span></div><div class="kv"><span>前回のログイン</span><span>${esc(fmt(mt.lastSignInTime))}</span></div></div>
    <h3 class="mg">アカウント</h3><div class="card">${row('out','close','ログアウト','','')}${row('del','trash','アカウントを削除','この操作は取り消せません','','ac-danger')}</div>
    <h3 class="mg">詳細設定</h3><div class="card">${row('cfg','sliders','Firebaseの設定','','')}${row('rules','list','セキュリティルール','','')}</div>`;
    el.dataset.d=1;
  };
  draw();
}
function openFbMembers(){
  const sh=sheet('');const box=$('.sheet',sh),me=FB.me();
  const draw=async()=>{
    let list=[];try{const d=await FB.F.getDoc(FB.ref());list=(d.exists()&&d.data().allowed)||[]}catch(e){}
    if(!list.includes(me))list=[me,...list];
    box.innerHTML=`<h3>共有メンバー</h3><p class="sp">ここに登録したメールアドレスで（確認済みのアカウントで）ログインした人だけが、在庫を見たり編集したりできます。</p>
    ${list.map(m=>`<div class="kv"><span>${esc(m)}</span><span>${m===me?'あなた':`<button class="btn sm ghost" data-rm="${esc(m)}">削除</button>`}</span></div>`).join('')}
    <label class="fl" for="fbadd">メンバーを追加</label><div class="inp"><input id="fbadd" type="email" inputmode="email" placeholder="name@example.com"></div>
    <button class="btn" id="fbaddb" style="margin-top:12px">追加する</button><button class="btn ghost" id="fbx" style="margin-top:8px">閉じる</button>`;
    const {setDoc,updateDoc,arrayUnion,arrayRemove}=FB.F;
    $('#fbx',box).onclick=()=>sh.close();
    $('#fbaddb',box).onclick=async()=>{const m=$('#fbadd',box).value.trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){toast('メールアドレスの形式が正しくありません');return}
      try{await setDoc(FB.ref(),{allowed:arrayUnion(me,m)},{merge:true});toast('追加しました');draw()}catch(e){toast(fbErr(e))}};
    box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const m=b.dataset.rm;
      if(!await ask('メンバーを削除しますか？',m+' は、この在庫を見られなくなります。','削除する',true))return;
      try{await updateDoc(FB.ref(),{allowed:arrayRemove(m)});toast('削除しました');draw()}catch(e){toast(fbErr(e))}});
  };
  box.innerHTML='<h3>共有メンバー</h3><p class="sp">読み込んでいます…</p>';draw();
}
ACT.fb=openFirebase;
if(FB.on())setTimeout(()=>{FB.load().then(()=>refresh()).catch(()=>{})},1200);
/* ---------- install banner ---------- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
const rmInstallBanner=()=>{const b=$('#ibn');if(b)b.remove()};
window.addEventListener('appinstalled',()=>{deferredInstall=null;rmInstallBanner();S.flags.pwaDone=true;save()});
function showInstallBanner(){
  try{
    if($('#ibn')||$('#ubn')||$('#plock'))return;
    if(S.flags.pwaDone||(S.flags.pwaHideUntil||0)>Date.now())return;
    if(matchMedia('(display-mode: standalone)').matches||navigator.standalone===true)return;
    const pc=matchMedia('(min-width:900px)').matches;
    const b=document.createElement('div');b.id='ibn';b.className='bnr';b.setAttribute('role','region');b.setAttribute('aria-label','アプリのインストール案内');
    b.innerHTML=`<span class="ii">${ic('box',24)}</span><div class="it"><b>在庫管理をアプリで使う</b><small>${pc?'デスクトップから1クリックで起動、専用ウィンドウで快適に使えます':'ホーム画面からすぐ起動、アプリのように快適に使えます'}</small></div><button class="ib" type="button">${pc?'インストール':'追加する'}</button><button class="ix" type="button" aria-label="閉じる">${ic('close',14)}</button>`;
    b.querySelector('.ix').onclick=()=>{S.flags.pwaHideUntil=Date.now()+14*DAY;save();rmInstallBanner()};
    b.querySelector('.ib').onclick=async()=>{
      if(deferredInstall){const d=deferredInstall;deferredInstall=null;try{d.prompt();await d.userChoice}catch(e){}rmInstallBanner()}
      else{openPwaGuide()}
    };
    document.body.appendChild(b);
  }catch(e){}
}

refresh();checkAutoBk();if(S.flags.sync)startSync(false);setInterval(checkAutoBk,30*60*1000);plShow();
setTimeout(oqFlush,2500);
try{const sm=new URLSearchParams(location.search).get('scan');if(sm){history.replaceState(null,'',location.pathname+location.hash);const k=MODES.findIndex(x=>x.k===sm);if(k>=0)setTimeout(()=>openScanner({mode:k}),900)}}catch(e){}
{const sp=$('#splash'),t0=performance.now();let gone=false;
 const hide=()=>{if(gone)return;gone=true;sp.classList.add('out');setTimeout(()=>sp.remove(),400);if(S.flags.wn!==WN_VER)setTimeout(openWhatsNew,500)};setTimeout(()=>{try{if(S.flags.autopo)runAutoPO(true)}catch(e){}},1500);
 sp.addEventListener('click',hide);

 if(document.fonts&&document.fonts.ready){Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(wait)}else wait();}
